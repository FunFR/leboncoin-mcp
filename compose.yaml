services:
  leboncoin-mcp:
    image: ghcr.io/funfr/leboncoin-mcp:latest
    build: .
    environment:
      MCP_PATH: ${MCP_PATH:-/mcp}
    # No authentication in the server: publish on loopback only.
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
